# Build the app-store package on a machine that has no MicroPythonOS checkout.
#
# This is the whole point of scripts/get_mpy_cross.sh: the .mpy bytecode must
# match the firmware, which used to mean "build the firmware first" and so kept
# packaging tied to one developer's laptop. Here the compiler is reconstructed
# from MicroPythonOS's own submodule pins, so every push produces the exact
# bytes a BadgeHub upload would carry — measured byte-identical to a run with a
# hand-built mpy-cross, because the .mpk is deterministic by construction
# (stored zip, fixed mtimes, sorted entries).
name: build

# Work arrives through pull requests, so a bare `push:` alongside `pull_request:`
# ran everything twice on every PR commit — once for the branch, once for the
# merge. The usual shape, and the one here: PRs are the gate, and main is built
# on push so the default branch always has a package of its own.
on:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are pointless — a force-push or a follow-up commit makes
# the previous answer irrelevant. Cancel those, but never cancel main: its runs
# are the record of what the default branch built, and each commit deserves its
# own artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Kept a separate job from the packaging: a formatting slip and a broken
  # build are different problems and should not share one red X.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: scripts/format.sh --check

  # The suite is pure Python against the app's modules with mpos/lvgl stubbed,
  # so it needs no badge and no emulator. It was silently red for four days
  # before this job existed — see the _gc_timer fix — which is the argument for
  # the job, not against the suite.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx pytest tests/ -q

  mpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build_mpk.sh reads the manifest version through `uv run python`.
      - uses: astral-sh/setup-uv@v7

      # Only the compiler binary is worth caching (~440 KB). The 100+ MB of
      # shallow git sources under src/ is deleted below before the post-run
      # cache save, so a warm run restores a single executable and skips both
      # the pin resolution and the make.
      - name: Cache mpy-cross
        uses: actions/cache@v6
        with:
          path: ~/.cache/foxhunt/mpy-cross
          key: mpy-cross-${{ hashFiles('scripts/get_mpy_cross.sh') }}

      - run: scripts/build_mpk.sh

      - name: Trim compiler sources from the cache
        if: always()
        run: rm -rf ~/.cache/foxhunt/mpy-cross/src

      - uses: actions/upload-artifact@v7
        with:
          name: foxhunt-mpk-${{ github.sha }}
          path: dist/*.mpk
          if-no-files-found: error
